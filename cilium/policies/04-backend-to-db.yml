apiVersion: cilium.io/v2

kind: CiliumNetworkPolicy

metadata:

  name: backend-egress

  namespace: demo

spec:

  endpointSelector:

    matchLabels:

      app: backend

  egress:

  - toEndpoints:

    - matchLabels:

        app: db

    toPorts:

    - ports:

      - port: "80"

        protocol: TCP

---

apiVersion: cilium.io/v2

kind: CiliumNetworkPolicy

metadata:

  name: db-ingress

  namespace: demo

spec:

  endpointSelector:

    matchLabels:

      app: db

  ingress:

  - fromEndpoints:

    - matchLabels:

        app: backend

    toPorts:

    - ports:

      - port: "80"

        protocol: TCP
