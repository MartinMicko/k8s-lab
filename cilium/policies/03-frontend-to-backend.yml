apiVersion: cilium.io/v2

kind: CiliumNetworkPolicy

metadata:

  name: frontend-egress

  namespace: demo

spec:

  endpointSelector:

    matchLabels:

      app: frontend

  egress:

  - toEndpoints:

    - matchLabels:

        app: backend

    toPorts:

    - ports:

      - port: "80"

        protocol: TCP

---

apiVersion: cilium.io/v2

kind: CiliumNetworkPolicy

metadata:

  name: backend-ingress

  namespace: demo

spec:

  endpointSelector:

    matchLabels:

      app: backend

  ingress:

  - fromEndpoints:

    - matchLabels:

        app: frontend

    toPorts:

    - ports:

      - port: "80"

        protocol: TCP
