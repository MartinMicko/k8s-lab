apiVersion: apps/v1

kind: Deployment

metadata:

  name: backend

  namespace: demo

spec:

  replicas: 1

  selector:

    matchLabels:

      app: backend

  template:

    metadata:

      labels:

        app: backend

        tier: backend

    spec:

      containers:

        - name: nginx

          image: nginx

          ports:

            - containerPort: 80

---

apiVersion: v1

kind: Service

metadata:

  name: backend

  namespace: demo

spec:

  selector:

    app: backend

  ports:

    - port: 80
