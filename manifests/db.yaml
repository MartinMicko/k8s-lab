apiVersion: apps/v1

kind: Deployment

metadata:

  name: db

  namespace: demo

spec:

  replicas: 1

  selector:

    matchLabels:

      app: db

  template:

    metadata:

      labels:

        app: db

        tier: db

    spec:

      containers:

        - name: nginx

          image: nginx

          ports:

            - containerPort: 80

---

apiVersion: v1

kind: Service

metadata:

  name: db

  namespace: demo

spec:

  selector:

    app: db

  ports:

    - port: 80
