apiVersion: apps/v1

kind: Deployment

metadata:

  name: frontend

  namespace: demo

spec:

  replicas: 1

  selector:

    matchLabels:

      app: frontend

  template:

    metadata:

      labels:

        app: frontend

        tier: frontend

    spec:

      containers:

        - name: nginx

          image: nginx

          ports:

            - containerPort: 80

---

apiVersion: v1

kind: Service

metadata:

  name: frontend

  namespace: demo

spec:

  selector:

    app: frontend

  ports:

    - port: 80
